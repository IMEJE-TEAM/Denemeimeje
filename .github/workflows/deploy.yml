name: Deploy to GitHub Pages

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install brotli
        run: sudo apt-get install -y brotli

      - name: Decompress Unity WebGL Brotli files
        run: |
          find . -name "*.br" -type f | while read f; do
            echo "Decompressing: $f"
            brotli --decompress "$f" --output "${f%.br}"
          done

      - name: Update Unity index.html (remove .br extensions)
        run: |
          find . -name "index.html" -type f | while read f; do
            sed -i \
              -e 's/\.data\.br/.data/g' \
              -e 's/\.framework\.js\.br/.framework.js/g' \
              -e 's/\.wasm\.br/.wasm/g' \
              "$f" || true
            echo "Updated $f"
          done

      - name: Add .nojekyll
        run: touch .nojekyll

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
