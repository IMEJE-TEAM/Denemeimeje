name: Deploy to GitHub Pages

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install brotli
        run: sudo apt-get install -y brotli

      - name: Decompress Unity WebGL Brotli files
        run: |
          cd "İmeje_Web_Simulasyon/Build"
          for f in *.br; do
            echo "Decompressing: $f"
            brotli --decompress "$f" --output "${f%.br}"
          done
          ls -lh

      - name: Update Unity index.html (remove .br extensions)
        run: |
          sed -i \
            -e 's/İmeje_Web_Simulasyon\.data\.br/İmeje_Web_Simulasyon.data/g' \
            -e 's/İmeje_Web_Simulasyon\.framework\.js\.br/İmeje_Web_Simulasyon.framework.js/g' \
            -e 's/İmeje_Web_Simulasyon\.wasm\.br/İmeje_Web_Simulasyon.wasm/g' \
            "İmeje_Web_Simulasyon/index.html"
          echo "Updated index.html:"
          grep -E "dataUrl|frameworkUrl|codeUrl" "İmeje_Web_Simulasyon/index.html"

      - name: Add .nojekyll
        run: touch .nojekyll

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
